<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Motoseyir · Download on the App Store</title>
<meta name="description" content="Motorcycle navigation built with AI: twisty round trips from a direction, and an AI co-rider in your helmet.">
<style>
  :root{--paper:#F3F6F6;--ink:#13252C;--dim:#5C7078;--accent:#0B6E7F}
  @media (prefers-color-scheme: dark){:root{--paper:#0C1A20;--ink:#E6EFF0;--dim:#93A9B1;--accent:#4BB3C7}}
  body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
       min-height:100vh;display:grid;place-items:center;padding:24px}
  main{max-width:560px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
  .rozet{font-size:56px}
  h1{margin:0;font-size:34px;letter-spacing:-.02em}
  p{margin:0;color:var(--dim)}
  .dugme{display:inline-block;margin-top:10px;padding:14px 22px;border-radius:12px;background:var(--accent);
         color:#fff;text-decoration:none;font-weight:600}
  footer{margin-top:26px;font-size:13px;color:var(--dim)}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <div class="rozet">🏍️</div>
  <h1>Motoseyir</h1>
  <p>Motorcycle navigation, built with AI. Pick a direction and a distance, get twisty round trips. Ask your AI CoRider for gas, coffee or weather without taking your hands off the bars.</p>
  <a id="indir" class="dugme" href="https://apps.apple.com/us/app/apple-store/id6792549131?pt=128439797&amp;ct=site-en&amp;mt=8">Download on the App Store</a>
  <footer><a href="/en/">motoseyir-app.com</a> · <a href="/gizlilik/en/">Privacy &amp; Support</a></footer>
</main>
<script>
  // /indir/'in İngilizce eşi (4 Eki 2026, ABD Meta reklamı): Traffic kampanyasında doğrudan App Store linki Meta incelemesinde
  // duraklatılıyor (#1487810), reklam bu sayfaya gelir. ct doğrulaması ve 600 ms iPhone yönlendirmesi aynı; mağaza /us/.
  (function () {
    var ct = new URLSearchParams(location.search).get("ct") || "site-en";
    if (!/^[a-z0-9-]{1,40}$/.test(ct)) ct = "site-en";
    // A/B (5 Eki 2026): TR'de (/indir/) Instagram mağazayı kendi içinde pencere olarak açıyor (sayfa 3. saniyede %74 görünür,
    // indirmelerin sayfa tipi "Store sheet"); ABD'de ziyaretlerin çoğu 3 sn içinde Instagram'dan çıkıyor, ~45 tıklamada 0 indirme.
    // Yarı ziyaretçi bugünkü /us/ linkine (a), yarısı ülke kodsuz linke (b) gider; ct'ye varyant eklenir, böylece hem
    // ölçüm (olcum-oku.py) hem App Store Connect'in kampanya kırılımı iki biçimi ayrı sayar.
    var varyant = Math.random() < 0.5 ? "a" : "b";
    ct = (ct + "-" + varyant).slice(0, 40);
    var link = varyant === "a"
      ? "https://apps.apple.com/us/app/apple-store/id6792549131?pt=128439797&ct=" + ct + "&mt=8"
      : "https://apps.apple.com/app/apple-store/id6792549131?pt=128439797&ct=" + ct + "&mt=8";
    document.getElementById("indir").href = link;
    var ua = navigator.userAgent || "";
    var SAYFA = "get";
    // ÖLÇÜM (4 Eki 2026): ABD Meta reklamı ~30 tıklamada 0 indirme gösterdi, aynı kodlu TR sayfası %40 çeviriyor. Meta yalnız
    // sayfanın açıldığını, App Store Connect sayfa görüntülemesini bir gün geç görüyor. Bu olaylar arayı kapatıyor:
    //   yuklendi → yonlendi → gizlendi  = App Store uygulaması açıldı (Instagram arka plana düştü)
    //   yonlendi → pagehide             = tarayıcı apps.apple.com WEB sayfasına gitti (ikinci dokunuş gerekir)
    //   yonlendi → 3sn/10sn-gorunur     = Instagram mağaza kartını sayfanın üstünde açtı YA DA hiçbir şey olmadı (TR ile kıyasla)
    // Anonim: çerez yok, oturum sayfa açılışı başına rastgele, IP saklanmıyor (server/olcum.py, moto-rota deposu).
    // Ölçüm hata verse bile aşağıdaki App Store yönlendirmesi her durumda çalışmalı.
    var olay = function () {};
    try {
      var bot = /facebookexternalhit|Facebot/i.test(ua);
      var t0 = Date.now(), oturum = (Math.random().toString(36) + "00000000").slice(2, 10);
      var surum = ua.match(/OS (\d+)_(\d+)/), ios = surum ? surum[1] + "." + surum[2] : "";
      var tar = /Instagram/.test(ua) ? "instagram" : /FBAN|FBAV|FBIOS/.test(ua) ? "facebook"
              : (/Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua)) ? "safari" : "diger";
      var tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
      olay = function (adim) {
        if (bot || !navigator.sendBeacon) return;
        try {
          navigator.sendBeacon("https://rota.motoseyir-app.com/olcum/olay", JSON.stringify({
            s: SAYFA, ct: ct, adim: adim, t: Date.now() - t0, o: oturum, tz: tz, ios: ios, tar: tar,
            dil: (navigator.language || "").slice(0, 12)
          }));
        } catch (e) {}
      };
      olay("yuklendi");
      document.addEventListener("visibilitychange", function () { olay(document.visibilityState === "hidden" ? "gizlendi" : "dondu"); });
      window.addEventListener("pagehide", function () { olay("pagehide"); });
      document.getElementById("indir").addEventListener("click", function () { olay("dugme"); });
      setTimeout(function () { olay(document.visibilityState === "visible" ? "3sn-gorunur" : "3sn-gizli"); }, 3000);
      setTimeout(function () { if (document.visibilityState === "visible") olay("10sn-gorunur"); }, 10000);
    } catch (e) {}
    if (/iPhone|iPad|iPod/.test(ua) && !/facebookexternalhit|Facebot/i.test(ua)) {
      setTimeout(function () { olay("yonlendi"); location.replace(link); }, 600);
    }
  })();
</script>
</body>
</html>
